<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4c9bff"/>
      <stop offset="1" stop-color="#1d5cb8"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: the stores apply their own corner mask. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Horseshoe magnet (opening to the right) with silver poles -->
  <path d="M400 322 A190 190 0 0 0 400 702" fill="none" stroke="#ec4b4b" stroke-width="124"/>
  <rect x="396" y="260" width="112" height="124" rx="10" fill="#e3e8ef"/>
  <rect x="396" y="640" width="112" height="124" rx="10" fill="#e3e8ef"/>
  <!-- Field lines -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" opacity="0.9">
    <path d="M560 400 Q600 512 560 624"/>
    <path d="M614 352 Q672 512 614 672" opacity="0.7"/>
  </g>
  <!-- Envelope being pulled -->
  <g transform="rotate(-8 770 512)">
    <rect x="650" y="420" width="250" height="180" rx="22" fill="#fff4dc" stroke="#24324a" stroke-width="22"/>
    <path d="M664 434 L775 520 L886 434" fill="none" stroke="#ec4b4b" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
